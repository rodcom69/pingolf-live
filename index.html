<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pingolf Live</title>
<style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<style>
  :root{
    --bg:#f5f1e6;
    --surface:#ffffff;
    --surface-2:#ece5d2;
    --text:#1c1a12;
    --text-dim:#6b6450;
    --border:#ddd3b8;
    --accent:#136b3e;
    --accent-ink:#ffffff;
    --gold:#b8862f;
    --bad:#a13f22;
    --shadow:0 1px 2px rgba(28,26,18,.06), 0 6px 20px rgba(28,26,18,.06);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#141309;
      --surface:#1e1c11;
      --surface-2:#292616;
      --text:#f2eddd;
      --text-dim:#a89f84;
      --border:#3a361f;
      --accent:#3fae6f;
      --accent-ink:#0d1a10;
      --gold:#e0ac3f;
      --bad:#e0805a;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    --bg:#141309;
    --surface:#1e1c11;
    --surface-2:#292616;
    --text:#f2eddd;
    --text-dim:#a89f84;
    --border:#3a361f;
    --accent:#3fae6f;
    --accent-ink:#0d1a10;
    --gold:#e0ac3f;
    --bad:#e0805a;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:"Inter",system-ui,-apple-system,Segoe UI,sans-serif;
    -webkit-tap-highlight-color:transparent;
  }
  .wrap{max-width:640px;margin:0 auto;padding:0 16px 48px;}
  h1,h2,h3{text-wrap:balance;font-family:"Teko",Impact,"Arial Narrow",sans-serif;font-weight:600;letter-spacing:.01em;margin:0;}
  .tnum{font-variant-numeric:tabular-nums;}

  header.top{
    background:linear-gradient(180deg,var(--surface) 0%, var(--surface) 100%);
    border-bottom:3px solid var(--gold);
    padding:18px 16px 14px;
    position:sticky;top:0;z-index:5;
  }
  header.top .inner{max-width:640px;margin:0 auto;}
  .brand-row{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap;}
  .brand-row h1{font-size:34px;line-height:1;color:var(--text);}
  .brand-row .place{font-size:13px;color:var(--text-dim);}
  .sub{font-size:13px;color:var(--text-dim);margin-top:2px;}

  .tabs{display:flex;gap:6px;margin-top:14px;background:var(--surface-2);padding:4px;border-radius:10px;}
  .tab-btn{
    flex:1;padding:9px 10px;border:none;border-radius:7px;background:transparent;color:var(--text-dim);
    font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;
  }
  .tab-btn.active{background:var(--accent);color:var(--accent-ink);}

  section.panel{display:none;padding-top:18px;}
  section.panel.active{display:block;}

  label.field-label{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-dim);margin-bottom:6px;}
  input[type="text"], input[type="number"], select{
    width:100%;padding:11px 12px;border-radius:9px;border:1px solid var(--border);
    background:var(--surface);color:var(--text);font-family:inherit;font-size:16px;
  }
  input[type="text"]:focus, input[type="number"]:focus, select:focus{outline:2px solid var(--accent);outline-offset:1px;}
  select{appearance:auto;}

  .name-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;box-shadow:var(--shadow);}
  .total-row{display:flex;align-items:flex-end;justify-content:space-between;margin-top:14px;padding-top:12px;border-top:1px dashed var(--border);}
  .total-value{font-family:"Teko",sans-serif;font-size:44px;line-height:1;color:var(--accent);}
  .total-note{font-size:12px;color:var(--text-dim);text-align:right;max-width:55%;}
  .progress-row{display:flex;align-items:center;justify-content:space-between;margin-top:12px;font-size:13px;color:var(--text-dim);}
  .progress-row strong{color:var(--text);}
  .undo-btn{background:none;border:1px solid var(--border);color:var(--text-dim);border-radius:7px;padding:6px 10px;font-size:12px;font-family:inherit;cursor:pointer;}
  .undo-btn:disabled{opacity:.4;}

  .hole-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px;}
  @media (max-width:420px){.hole-grid{grid-template-columns:repeat(2,1fr);}}
  .hole-tile{
    background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 8px;
    text-align:center;cursor:pointer;position:relative;box-shadow:var(--shadow);color:var(--text);font-family:inherit;
  }
  .hole-tile:disabled{opacity:.45;cursor:not-allowed;}
  .hole-tile .hn{font-family:"Teko",sans-serif;font-size:26px;line-height:1;color:var(--text-dim);}
  .hole-tile .mname{font-size:11.5px;font-weight:600;margin-top:2px;min-height:28px;line-height:1.25;}
  .hole-tile .mtarget{font-size:13px;font-weight:800;color:var(--text);margin-top:3px;}
  .hole-tile.done .mtarget{font-size:11px;font-weight:600;color:var(--text-dim);}
  .hole-tile .badge{
    position:absolute;top:-7px;right:-7px;background:var(--accent);color:var(--accent-ink);
    font-family:"Teko",sans-serif;font-size:17px;min-width:24px;height:24px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;border:2px solid var(--bg);
  }
  .hole-tile.done{border-color:var(--accent);}
  .hole-tile .mull-tag{position:absolute;top:-7px;left:-7px;background:var(--gold);color:#1c1a12;font-size:10px;font-weight:800;
    padding:3px 6px;border-radius:999px;border:2px solid var(--bg);letter-spacing:.03em;}
  .mull-section{display:flex;flex-direction:column;gap:10px;margin-top:18px;}
  .mull-card{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font-family:inherit;color:var(--text);
    background:var(--surface);border:1px dashed var(--gold);border-radius:11px;padding:12px 14px;cursor:pointer;box-shadow:var(--shadow);}
  .mull-card.used{border-style:solid;}
  .mull-card:disabled{opacity:.5;cursor:not-allowed;border-color:var(--border);}
  .mull-card .mc-label{font-family:"Teko",sans-serif;font-size:22px;line-height:1;color:var(--gold);flex-shrink:0;width:92px;}
  .mull-card .mc-body{flex:1;min-width:0;font-size:13px;}
  .mull-card .mc-body b{display:block;font-size:14px;}
  .mull-card .mc-sub{color:var(--text-dim);font-size:12px;margin-top:2px;}
  .mull-card .mc-strokes{font-family:"Teko",sans-serif;font-size:26px;color:var(--accent);flex-shrink:0;}
  .lb-topar{font-size:12px;color:var(--text-dim);text-align:right;}
  .attempt-line .mtag{font-size:10px;font-weight:800;color:var(--gold);flex-shrink:0;}
  .tv-cell.mull .pip{box-shadow:0 0 0 2px var(--gold);}
  .tv-topar{font-size:.75em;color:var(--text-dim);}

  .overlay{
    position:fixed;inset:0;background:rgba(10,9,4,.55);display:flex;align-items:flex-end;justify-content:center;
    z-index:20;
  }
  .sheet{
    background:var(--surface);width:100%;max-width:640px;border-radius:16px 16px 0 0;
    padding:20px 18px 26px;box-shadow:var(--shadow);max-height:88vh;overflow-y:auto;
  }
  .sheet h2{font-size:26px;}
  .sheet .target-line{color:var(--text);font-size:18px;font-weight:800;margin-top:4px;}
  .note{background:var(--surface-2);border-radius:9px;padding:8px 10px;font-size:12.5px;color:var(--text-dim);margin-top:12px;}
  .ball-btns{display:flex;flex-direction:column;gap:8px;margin-top:14px;}
  .ball-btn{
    background:var(--accent);color:var(--accent-ink);border:none;border-radius:10px;padding:13px 14px;
    font-family:inherit;font-weight:700;font-size:14.5px;text-align:left;cursor:pointer;display:flex;justify-content:space-between;
  }
  .ball-btn .strokes-pill{font-family:"Teko",sans-serif;font-size:19px;}
  .divider{display:flex;align-items:center;gap:10px;margin:16px 0 10px;color:var(--text-dim);font-size:12px;text-transform:uppercase;letter-spacing:.05em;}
  .divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--border);}
  .miss-row{display:flex;gap:8px;}
  .save-btn{background:var(--text);color:var(--bg);border:none;border-radius:9px;padding:0 16px;font-family:inherit;font-weight:700;cursor:pointer;}
  .close-btn{display:block;width:100%;text-align:center;margin-top:18px;background:none;border:none;color:var(--text-dim);font-family:inherit;font-size:14px;padding:8px;cursor:pointer;}

  .lb-list{display:flex;flex-direction:column;gap:8px;margin-top:14px;}
  .obj-list{display:flex;flex-direction:column;gap:10px;margin-top:14px;}
  .obj-card{background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 13px;box-shadow:var(--shadow);}
  .obj-head{display:flex;align-items:baseline;gap:10px;}
  .obj-num{font-family:"Teko",sans-serif;font-size:22px;color:var(--text-dim);width:20px;flex-shrink:0;text-align:center;}
  .obj-name{flex:1;font-weight:600;font-size:14px;}
  .obj-target{font-size:11px;color:var(--text-dim);flex-shrink:0;}
  .obj-target b{font-family:"Teko",sans-serif;font-size:18px;color:var(--accent);font-weight:600;}
  .obj-ranges{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px;}
  .obj-range{flex:1 1 auto;min-width:31%;background:var(--surface-2);border-radius:7px;padding:5px 8px;font-size:11px;color:var(--text-dim);white-space:nowrap;}
  .obj-range b{font-family:"Teko",sans-serif;font-size:16px;color:var(--text);margin-right:5px;}
  .lb-row{background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 13px;box-shadow:var(--shadow);}
  .lb-top{display:flex;align-items:center;gap:10px;cursor:pointer;}
  .lb-rank{font-family:"Teko",sans-serif;font-size:24px;color:var(--gold);width:26px;flex-shrink:0;}
  .lb-name{flex:1;font-weight:700;font-size:15px;}
  .lb-thru{font-size:11.5px;color:var(--text-dim);}
  .lb-total{font-family:"Teko",sans-serif;font-size:28px;color:var(--text);}
  .lb-detail{margin-top:10px;padding-top:10px;border-top:1px dashed var(--border);display:none;}
  .lb-detail.open{display:block;}
  .attempt-line{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:4px 0;color:var(--text-dim);}
  .attempt-line .an{flex:1;min-width:0;color:var(--text);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .attempt-line .araw{color:var(--text-dim);flex-shrink:0;}
  .attempt-line .as{font-family:"Teko",sans-serif;font-size:16px;color:var(--accent);width:34px;flex-shrink:0;text-align:right;}
  .attempt-line.ace .as{color:var(--gold);font-weight:700;text-shadow:0 0 8px rgba(184,134,47,.5);}
  .attempt-line.ace .an{color:var(--gold);font-weight:700;}
  .attempt-line.dropped{text-decoration:line-through;opacity:.5;}
  .del-x{margin-left:auto;background:none;border:none;color:var(--bad);font-size:15px;cursor:pointer;padding:2px 6px;}
  .del-x.armed{font-size:12px;font-weight:700;border:1px solid var(--bad);border-radius:6px;}
  .empty-note{color:var(--text-dim);font-size:14px;text-align:center;padding:30px 10px;}

  details.rules{margin-top:22px;background:var(--surface-2);border-radius:10px;padding:10px 14px;}
  details.rules summary{font-size:13px;font-weight:700;cursor:pointer;color:var(--text-dim);}
  details.rules p{font-size:13px;color:var(--text-dim);line-height:1.5;}

  .conn-note{font-size:11.5px;color:var(--text-dim);text-align:center;margin-top:10px;}
  .conn-note.err{color:var(--bad);}

  body.tv-mode{background:#0c0b06;color:#f2eddd;}
  body.tv-mode .wrap{max-width:none;width:100%;padding:1.4vw 2vw 2vw;box-sizing:border-box;}
  body.tv-mode header.top{background:#0c0b06;border-bottom:.3vw solid var(--gold);padding:1.4vw 0 1.1vw;position:static;}
  body.tv-mode .brand-row h1{font-size:clamp(28px,4.6vw,64px);color:#f2eddd;}
  body.tv-mode .brand-row .place{font-size:clamp(13px,1.6vw,22px);color:#b8ab86;}
  body.tv-mode .sub{font-size:clamp(11px,1.3vw,18px);color:#b8ab86;}
  body.tv-mode .tabs{display:none;}
  body.tv-mode #panel-score{display:none !important;}
  body.tv-mode #panel-board{display:block !important;padding-top:1.6vw;}
  body.tv-mode details.rules{display:none;}
  body.tv-mode .lb-list{display:none;}
  body.tv-mode .empty-note{font-size:clamp(16px,2vw,26px);padding:8vw 10px;}

  .tv-board{width:100%;border-collapse:separate;border-spacing:0 .5vw;table-layout:fixed;}
  .tv-board th, .tv-board td{padding:.6vw .5vw;text-align:center;font-variant-numeric:tabular-nums;}
  .tv-board thead th{background:#1c1a10;font-family:"Teko",sans-serif;font-weight:600;font-size:clamp(14px,1.7vw,24px);color:#b8ab86;letter-spacing:.02em;border-bottom:.15vw solid #3a361f;}
  .tv-board thead th:first-child{border-radius:.7vw 0 0 .7vw;}
  .tv-board thead th:last-child{border-radius:0 .7vw .7vw 0;}
  .tv-board thead th.th-player{text-align:left;font-family:"Inter",sans-serif;font-size:clamp(11px,1.1vw,15px);text-transform:uppercase;letter-spacing:.08em;}
  .tv-board thead th.th-thru{font-family:"Inter",sans-serif;font-size:clamp(10px,1vw,13px);text-transform:uppercase;letter-spacing:.06em;}
  .tv-board thead th.th-total{color:var(--gold);}
  .tv-board col.col-player{width:20%;}
  .tv-board col.col-thru{width:6%;}
  .tv-board col.col-hole{width:auto;}
  .tv-board col.col-total{width:8%;}
  .tv-board .tv-thru-cell{font-family:"Teko",sans-serif;font-size:clamp(14px,1.8vw,22px);color:#b8ab86;}
  .tv-board tbody tr td{background:#1c1a10;}
  .tv-board tbody tr td:first-child{border-radius:.7vw 0 0 .7vw;}
  .tv-board tbody tr td:last-child{border-radius:0 .7vw .7vw 0;}
  .tv-board .tv-rank{font-family:"Teko",sans-serif;font-size:clamp(16px,2vw,28px);color:var(--gold);width:2.4vw;}
  .tv-board .tv-name{color:#f2eddd;text-align:left;font-weight:700;font-size:clamp(14px,1.9vw,26px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .tv-board .tv-cell{font-family:"Teko",sans-serif;font-size:clamp(14px,1.8vw,24px);color:#5c5844;}
  .tv-board .tv-cell.played{color:#f2eddd;}
  .tv-board .tv-cell .pip{display:inline-flex;align-items:center;justify-content:center;width:1.9vw;height:1.9vw;min-width:22px;min-height:22px;border-radius:50%;}
  .tv-board .tv-cell.hit .pip{background:var(--accent);color:#eafff2;font-weight:700;}
  .tv-board .tv-cell.ace .pip{background:var(--gold);color:#241c06;font-weight:700;box-shadow:0 0 0 .2vw rgba(224,172,63,.4), 0 0 1vw rgba(224,172,63,.65);}
  .tv-board .tv-cell.ace{color:var(--gold);}
  .tv-board .tv-cell.fair .pip{background:#5a5636;color:#fbf6e4;font-weight:700;}
  .tv-board .tv-cell.poor .pip{background:#7a3a26;color:#ffe9df;font-weight:700;}
  .tv-board .tv-cell.dropped .pip{opacity:.4;text-decoration:line-through;}
  .tv-board .tv-total-val{font-family:"Teko",sans-serif;font-size:clamp(20px,2.6vw,36px);color:var(--gold);font-weight:700;}

</style>

<body>

<div class="wrap">
  <header class="top"><div class="inner">
    <div class="brand-row">
      <h1>XGOLF PINGOLF</h1>
      <span class="place">Chester Springs, PA</span>
    </div>
    <div class="sub" id="eventSub">Loading event&hellip;</div>
    <div class="tabs">
      <button class="tab-btn active" data-tab="score">Enter Score</button>
      <button class="tab-btn" data-tab="board">Leaderboard</button>
      <button class="tab-btn" data-tab="rules">Objectives</button>
      <button class="tab-btn" data-tab="history">History</button>
    </div>
  </div></header>

  <section class="panel active" id="panel-score">
    <div class="name-card">
      <label class="field-label" for="nameSelect">Already started? Select yourself</label>
      <select id="nameSelect">
        <option value="">+ New player</option>
      </select>
      <div id="newNameWrap" style="margin-top:10px;">
        <label class="field-label" for="nameInput">Enter your name</label>
        <input type="text" id="nameInput" placeholder="Type your name" autocomplete="off">
      </div>
      <div class="total-row" id="totalRow" style="display:none;">
        <div>
          <div class="field-label" style="margin-bottom:2px;">Current total</div>
          <div class="total-value tnum" id="totalValue">0</div>
        </div>
        <div class="total-note" id="totalNote"></div>
      </div>
      <div class="progress-row">
        <span>Holes played: <strong class="tnum" id="playedCount">0</strong> / 18 &middot; Mulligans left: <strong class="tnum" id="mullCount">2</strong></span>
        <button class="undo-btn" id="undoBtn" disabled>Undo last entry</button>
      </div>
    </div>

    <div class="hole-grid" id="holeGrid"></div>
    <div class="mull-section" id="mullSection"></div>

    <details class="rules">
      <summary>How scoring works</summary>
      <p id="rulesNoteShort"></p>
    </details>
    <div class="conn-note" id="connNote"></div>
  </section>

  <section class="panel" id="panel-board">
    <div id="tvBoardWrap" style="overflow-x:auto;"></div>
    <div class="lb-list" id="lbList" style="margin-top:16px;"><div class="empty-note">No scores yet &mdash; be the first on the board.</div></div>
  </section>

  <section class="panel" id="panel-rules">
    <div class="note" id="rulesNoteFull" style="margin-top:0;font-size:13.5px;line-height:1.5;"></div>
    <div class="obj-list" id="objList"></div>
  </section>

  <section class="panel" id="panel-history">
    <label class="field-label" for="historyEventSelect">Past events</label>
    <select id="historyEventSelect"><option value="">Loading&hellip;</option></select>
    <div id="historyBoardWrap" style="overflow-x:auto;margin-top:14px;"></div>
  </section>

  <div class="overlay" id="overlay" style="display:none;">
    <div class="sheet">
      <h2 id="sheetHoleName">Hole</h2>
      <div class="target-line" id="sheetTarget">Target: 0</div>
      <div id="sheetGameWrap" hidden style="margin-top:12px;">
        <label class="field-label" for="sheetGame">Which game are you replaying?</label>
        <select id="sheetGame"></select>
      </div>
      <div class="note" id="sheetEditNote" hidden></div>
      <div class="ball-btns">
        <button class="ball-btn" data-ball="1">Hit it on Ball 1 <span class="strokes-pill">1</span></button>
        <button class="ball-btn" data-ball="2">Hit it on Ball 2 <span class="strokes-pill">2</span></button>
        <button class="ball-btn" data-ball="3">Hit it on Ball 3 <span class="strokes-pill">3</span></button>
      </div>
      <div class="divider">or, short of target</div>
      <div class="miss-row">
        <input type="number" id="missScore" placeholder="Final score" inputmode="numeric">
        <button class="save-btn" id="missSave">Save</button>
      </div>
      <button class="close-btn" id="sheetClose">Cancel</button>
    </div>
  </div>
</div>

  // The Sept 19 practice round used a 17-hole layout; keep it so History lines up.
  var HOLES_SEPT_2026 = [

    {n:15, name:"NBA Fast Break"}, {n:16, name:"Game of Thrones"}, {n:17, name:"Mustang"}
  ];
  function holesForEvent(eventId){
    return eventId === 'evt_practice_20260919' ? HOLES_SEPT_2026 : HOLES;
  }
  var MAX_MULLIGANS = 2, PAR = 3;
  var RULES_TEXT = 'Hit the target on ball 1, 2, or 3 \u2014 that\'s your stroke count for the hole (1, 2, or 3). Short of target after 3 balls? Enter your final score and strokes (4\u20138) are looked up automatically. Play all 18 holes. Once all 18 are done, you get 2 mulligans: pick any game, play it again, and enter the score. It replaces that hole on your card only if it\'s better. Each mulligan must be a different game. Par is 3 per hole (54 total). Lowest total wins.';

  function strokeRanges(target){
    var b4 = Math.round(target*4/5), b3 = Math.round(target*3/5), b2 = Math.round(target*2/5), b1 = Math.round(target*1/5);
    return [
      {s:4, lo:b4, hi:target-1},
      {s:5, lo:b3, hi:b4-1},
      {s:6, lo:b2, hi:b3-1},
      {s:7, lo:b1, hi:b2-1},
      {s:8, lo:0, hi:b1-1}
    ];
  }
  function chartStrokes(target, score){
    if (score >= target) return 3;
    if (score >= target*4/5) return 4;
    if (score >= target*3/5) return 5;
    if (score >= target*2/5) return 6;
    if (score >= target*1/5) return 7;
    return 8;
  }
  function fmtNum(n){ return n.toLocaleString("en-US"); }
  function esc(v){
    return String(v == null ? '' : v).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  // Organizer mode (#admin in the URL) shows the delete button on every entry.
  // This only changes the UI; the Firestore rules are what actually protect data.
  var adminMode = /admin/i.test(window.location.hash);
  function attemptScoreLabel(a){ return a.method === 'ball' ? ('Ball ' + a.ball) : fmtNum(a.rawScore); }
  function playerKey(name){ return name.trim().toLowerCase(); }
  // Work out which entry counts on each hole. Each hole has one regular entry
  // (the newest, if a double-tap ever saved two). Mulligans are extra entries,
  // used in the order played; one replaces its hole only if it took fewer strokes.
  function scoreRound(attempts){
    var originals = {};
    attempts.forEach(function(a){
      if (a.mulligan) return;
      if (!originals[a.hole] || a.ts > originals[a.hole].ts) originals[a.hole] = a;
    });
    var mulls = attempts.filter(function(a){ return a.mulligan; })
      .sort(function(a,b){ return a.ts - b.ts; }).slice(0, MAX_MULLIGANS);
    var byHole = {};
    Object.keys(originals).forEach(function(k){ byHole[k] = originals[k]; });
    mulls.forEach(function(m){
      if (byHole[m.hole] && m.strokes < byHole[m.hole].strokes) byHole[m.hole] = m;
    });
    var counted = Object.keys(byHole).map(function(k){ return byHole[k]; });
    var total = counted.reduce(function(s,a){ return s + a.strokes; }, 0);
    var thru = Object.keys(originals).length;
    return {
      total: total,
      thru: thru,
      complete: thru >= HOLES.length,
      toPar: total - PAR * counted.length,
      byHole: byHole,
      originals: originals,
      mulls: mulls,
      countedIds: counted.map(function(a){ return a.id; }),
      mulligansUsed: mulls.length
    };
  }
  function fmtPar(n){ return n === 0 ? 'E' : (n > 0 ? '+' + n : String(n)); }
  function rankPlayers(a, b){ return a.res.toPar - b.res.toPar || b.res.thru - a.res.thru || a.name.localeCompare(b.name); }

  var allAttempts = [];

  function refreshNameSelect(){

  var TAB_NAMES = ['score', 'board', 'rules', 'history'];

  if (TAB_NAMES.indexOf(window.location.hash.slice(1)) !== -1) {

  function myAttempts(){

  function renderScoreTab(){
    var mine = myAttempts();
    var res = scoreRound(mine);
    document.getElementById('playedCount').textContent = res.thru;

            (used ? ('replaced ' + orig.strokes + ' \u2192 ' + m.strokes) : ('not better, kept your ' + (orig ? orig.strokes : '\u2014'))) + '</div>';

          card.disabled = !nameReady;

  function showSheetHole(hole){
    currentHole = hole;

    document.getElementById('sheetTarget').textContent = 'Target: ' + fmtNum(hole.target);
  }

  // Tapping a hole: first entry, or fix the regular entry already there.
  function openSheet(hole){
    var res = scoreRound(myAttempts());
    var orig = res.originals[hole.n];
    sheetMode = orig ? 'fix' : 'new';
    currentEditId = orig ? orig.id : null;
    document.getElementById('sheetGameWrap').hidden = true;
    showSheetHole(hole);
    document.getElementById('missScore').value = '';
    var note = document.getElementById('sheetEditNote');

      note.hidden = false;
      note.textContent = 'Fixing your entry (currently ' + attemptScoreLabel(orig) + ' \u2192 ' + orig.strokes + ' strokes). Saving below replaces it.' +
        (res.byHole[hole.n] !== orig ? ' Your mulligan on this hole still counts while it\'s better.' : '');
    } else {
      note.hidden = true;
    }
    document.getElementById('overlay').style.display = 'flex';
  }

  // Mulligan slot: pick a game (not one the other mulligan used) and enter the score.
  function openMulliganSheet(existing){
    var res = scoreRound(myAttempts());
    if (!existing && (!res.complete || res.mulligansUsed >= MAX_MULLIGANS)) return;
    sheetMode = 'mull';
    currentEditId = existing ? existing.id : null;
    var taken = res.mulls.filter(function(m){ return m !== existing; }).map(function(m){ return m.hole; });
    var sel = document.getElementById('sheetGame');
    sel.innerHTML = '<option value="">Select a game\u2026</option>' + HOLES.filter(function(h){ return taken.indexOf(h.n) === -1; }).map(function(h){
      var o = res.originals[h.n];

    document.getElementById('missScore').value = '';

    note.hidden = false;

      'Pick the game you replayed, then enter how it went. It replaces that hole only if it\'s better.';

  function setSheetButtons(){

  function closeSheet(){

  function submitAttempt(strokes, method, extra){
    if (!currentHole) return;
    var name = nameInput.value.trim();
    if (!name) return;
    if (CURRENT_EVENT_ID === null) {
      closeSheet();
      setConnNote('Still connecting to the scoreboard. Your score was not saved; try again in a moment.', true);
      return;
    }
    var mine = myAttempts();
    var res = scoreRound(mine);
    var editId = currentEditId;
    var isMull = sheetMode === 'mull';
    if (isMull) {
      var otherMulls = res.mulls.filter(function(m){ return m.id !== editId; });
      if (!res.complete || otherMulls.length >= MAX_MULLIGANS ||
          otherMulls.some(function(m){ return m.hole === currentHole.n; })) { closeSheet(); return; }
    } else if (!editId && res.originals[currentHole.n]) { closeSheet(); return; }
    var data = {
      playerKey: playerKey(name),
      playerName: name,
      hole: currentHole.n,
      holeName: currentHole.name,
      target: currentHole.target,
      strokes: strokes,
      method: method,
      eventId: CURRENT_EVENT_ID,
      eventLabel: CURRENT_EVENT_LABEL,
      ts: Date.now()
    };
    if (extra) Object.assign(data, extra);
    if (isMull) data.mulligan = true;
    closeSheet();
    var op = editId ? db.collection('attempts').doc(editId).set(data) : db.collection('attempts').add(data);
    op.catch(function(err){
      setConnNote('Could not save that score (' + err.message + '). Check your connection and try again.', true);
    });
  }

  document.getElementById('undoBtn').addEventListener('click', function(){

  function renderLeaderboard(){
    var byPlayer = {};
    allAttempts.forEach(function(a){
      if (!byPlayer[a.playerKey]) byPlayer[a.playerKey] = {name: a.playerName, attempts: []};
      byPlayer[a.playerKey].name = a.playerName;
      byPlayer[a.playerKey].attempts.push(a);

    var players = Object.keys(byPlayer).map(function(k){

    list.innerHTML = '';
    players.forEach(function(p, i){
      var row = document.createElement('div');
      row.className = 'lb-row';
      var sortedAttempts = p.attempts.slice().sort(function(a,b){ return a.hole - b.hole || a.ts - b.ts; });
      var canDelete = adminMode || p.key === playerKey(nameInput.value || '');
      var lines = sortedAttempts.map(function(a){

          '</div>';

      row.innerHTML =
        '<div class="lb-top">' +
          '<div class="lb-rank">' + (i+1) + '</div>' +
          '<div style="flex:1;min-width:0;"><div class="lb-name">' + esc(p.name) + '</div><div class="lb-thru">thru ' + p.res.thru +
            (p.res.mulligansUsed ? ' · ' + p.res.mulligansUsed + ' mulligan' + (p.res.mulligansUsed === 1 ? '' : 's') : '') + '</div></div>' +
          '<div><div class="lb-total tnum">' + p.res.total + '</div><div class="lb-topar">' + fmtPar(p.res.toPar) + '</div></div>' +
        '</div>' +
        '<div class="lb-detail">' + lines + '</div>';
      row.querySelector('.lb-top').addEventListener('click', function(){
        row.querySelector('.lb-detail').classList.toggle('open');
      });
      row.querySelectorAll('.del-x').forEach(function(x){
        x.addEventListener('click', function(e){
          e.stopPropagation();
          if (!x.classList.contains('armed')) {
            // First tap only arms the button; a second tap within 4s deletes.
            x.classList.add('armed');
            x.textContent = 'Delete?';
            setTimeout(function(){
              if (x.isConnected) { x.classList.remove('armed'); x.innerHTML = '&times;'; }
            }, 4000);
            return;
          }
          db.collection('attempts').doc(x.dataset.id).delete().catch(function(err){
            setConnNote('Could not remove that entry (' + err.message + ').', true);
          });
        });
      });
      list.appendChild(row);
    });
  }

  function buildBoardHtml(attemptsList, holes){
    holes = holes || HOLES;
    var byPlayer = {};
    attemptsList.forEach(function(a){
      if (!byPlayer[a.playerKey]) byPlayer[a.playerKey] = {name: a.playerName, attempts: []};
      byPlayer[a.playerKey].name = a.playerName;
      byPlayer[a.playerKey].attempts.push(a);
    });
    var players = Object.keys(byPlayer).map(function(k){
      var p = byPlayer[k];
      var res = scoreRound(p.attempts);
      return {name:p.name, attempts:p.attempts, res:res};
    });
    if (!players.length) return '';
    players.sort(rankPlayers);

    var head = '<th class="th-rank"></th><th class="th-player">Player</th><th class="th-thru">Thru</th>' +
      holes.map(function(h){ return '<th>' + h.n + '</th>'; }).join('') +
      '<th class="th-total">Total</th>';

    var rows = players.map(function(p, i){
      var byHole = p.res.byHole;
      var cells = holes.map(function(h){
        var a = byHole[h.n];
        if (!a) return '<td class="tv-cell">&mdash;</td>';
        var tier = a.strokes === 1 ? 'ace' : a.strokes <= 3 ? 'hit' : a.strokes <= 6 ? 'fair' : 'poor';
        return '<td class="tv-cell played ' + tier + (a.mulligan ? ' mull' : '') + '">' +
          '<span class="pip">' + a.strokes + '</span></td>';
      }).join('');
      return '<tr>' +
        '<td class="tv-rank">' + (i + 1) + '</td>' +
        '<td class="tv-name">' + esc(p.name) + '</td>' +
        '<td class="tv-thru-cell">' + p.res.thru + '</td>' +
        cells +
        '<td><span class="tv-total-val">' + p.res.total + '</span> <span class="tv-topar">' + fmtPar(p.res.toPar) + '</span></td>' +
      '</tr>';
    }).join('');

    return '<table class="tv-board"><colgroup><col class="col-rank">' +
      '<col class="col-player">' +
      '<col class="col-thru">' +
      holes.map(function(){ return '<col class="col-hole">'; }).join('') +
      '<col class="col-total"></colgroup>' +
      '<thead><tr>' + head + '</tr></thead><tbody>' + rows + '</tbody></table>';
  }

  function renderTvBoard(){
    var wrap = document.getElementById('tvBoardWrap');
    if (!wrap) return;
    var html = buildBoardHtml(allAttempts);
    wrap.innerHTML = html || (tvMode ? '<div class="empty-note">Waiting for the first score&hellip;</div>' : '');
  }

  var historyEvents = null;
  function loadHistory(){
    if (historyEvents) return;
    historyEvents = [];
    db.collection('attempts').get().then(function(snap){
      var byEvent = {};
      snap.docs.forEach(function(d){
        var a = d.data();
        var key = a.eventId || 'unknown';
        if (!byEvent[key]) byEvent[key] = {id: key, label: a.eventLabel || key, minTs: a.ts, attempts: []};
        if (a.ts < byEvent[key].minTs) byEvent[key].minTs = a.ts;
        byEvent[key].attempts.push(a);
      });
      historyEvents = Object.keys(byEvent).map(function(k){ return byEvent[k]; });
      historyEvents.sort(function(a,b){ return b.minTs - a.minTs; });
      var sel = document.getElementById('historyEventSelect');
      if (!historyEvents.length) { sel.innerHTML = '<option value="">No events yet</option>'; return; }
      sel.innerHTML = historyEvents.map(function(e){
        return '<option value="' + esc(e.id) + '">' + esc(e.label) + (e.id === CURRENT_EVENT_ID ? ' (current)' : '') + '</option>';
      }).join('');
      renderHistoryBoard(historyEvents[0].id);
    });
  }
  function renderHistoryBoard(eventId){
    var ev = historyEvents.find(function(e){ return e.id === eventId; });
    var wrap = document.getElementById('historyBoardWrap');
    wrap.innerHTML = ev ? (buildBoardHtml(ev.attempts, holesForEvent(ev.id)) || '<div class="empty-note">No scores in this event.</div>') : '';
  }
  document.getElementById('historyEventSelect').addEventListener('change', function(){
    renderHistoryBoard(this.value);
  });

  function renderAll(){
    renderScoreTab();
    renderLeaderboard();
    refreshNameSelect();
    renderTvBoard();
  }

  var tvMode = /tv/i.test(window.location.hash);
  if (tvMode) {
    document.body.classList.add('tv-mode');
    document.body.setAttribute('data-theme', 'dark');
    document.getElementById('panel-board').classList.add('active');
  }

  document.getElementById('objList').innerHTML = HOLES.map(function(h){
    var ranges = strokeRanges(h.target);
    var rangeHtml = ranges.map(function(r){
      return '<div class="obj-range"><b>' + r.s + '</b>' + fmtNum(r.lo) + '&ndash;' + fmtNum(r.hi) + '</div>';
    }).join('');
    return '<div class="obj-card">' +
      '<div class="obj-head">' +
        '<div class="obj-num tnum">' + h.n + '</div>' +
        '<div class="obj-name">' + h.name + '</div>' +
        '<div class="obj-target">target<br><b class="tnum">' + h.label + '</b></div>' +
      '</div>' +
      '<div class="obj-ranges">' + rangeHtml + '</div>' +
      '</div>';
  }).join('');
  document.getElementById('rulesNoteShort').textContent = RULES_TEXT;
  document.getElementById('rulesNoteFull').textContent = RULES_TEXT;

  renderAll();
  setConnNote('Connecting…', false);

  function startAttemptsListener(){
    db.collection('attempts').where('eventId', '==', CURRENT_EVENT_ID).onSnapshot(function(snap){
      setConnNote('', false);
      allAttempts = snap.docs.map(function(d){
        var data = d.data() || {};
        data.id = d.id;
        return data;
      });
      renderAll();
    }, function(err){
      setConnNote('Connection lost (' + err.message + '). Scores you already entered are safe; reload to retry.', true);
    });
  }

  // Find the current event before allowing any scoring. If the lookup fails
  // (bad venue wifi), keep retrying rather than guessing an event, so scores
  // never land somewhere the live board isn't showing.
  var metaTries = 0;
  function loadCurrentEvent(){
    db.collection('meta').doc('current').get().then(function(snap){
      var m = snap.exists ? snap.data() : {};
      CURRENT_EVENT_ID = m.eventId || 'default';
      CURRENT_EVENT_LABEL = m.eventLabel || 'Live';
      var eventNumber = m.eventNumber ? ('Event ' + m.eventNumber + ' · ') : '';
      var eventDate = m.eventDate ? (m.eventDate + ' · ') : '';
      document.getElementById('eventSub').textContent = eventNumber + eventDate + 'lowest total wins';
      startAttemptsListener();
      renderAll();
    }).catch(function(){
      metaTries++;
      var wait = Math.min(30, 3 * metaTries);
      setConnNote("Can't reach the scoreboard. Retrying in " + wait + 's…', true);
      setTimeout(loadCurrentEvent, wait * 1000);
    });
  }
  loadCurrentEvent();
})();
</script>
</body>
</html>
